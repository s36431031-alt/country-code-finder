<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country & Short Code Finder</title>
<style>
:root{--bg:#08111f;--panel:#101d30;--line:#263750;--text:#f4f7fb;--muted:#a9b8cc;--accent:#37d6a0;--blue:#5b9cff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#08111f,#101c31);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;min-height:100vh;padding:22px 14px}
.wrap{max-width:680px;margin:auto}.hero{text-align:center;padding:18px 8px 22px}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#37d6a0,#3685ff);display:grid;place-items:center;margin:0 auto 12px;font-size:27px;color:#06111d;font-weight:900}.hero h1{font-size:clamp(23px,6vw,32px);margin:0 0 7px}.hero p{color:var(--muted);margin:0;font-size:14px}
.card{background:rgba(16,29,48,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #0003}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:17px}.tab{border:1px solid var(--line);border-radius:12px;background:#0b1728;color:var(--muted);padding:11px 5px;font-size:13px;font-weight:700;cursor:pointer}.tab.active{background:#123b39;border-color:#2ba982;color:#75f0c3}.fieldlabel{display:block;color:#c8d4e4;font-size:13px;margin:0 0 8px}.inputrow{display:flex;gap:8px}.input{width:100%;min-width:0;background:#091525;border:1px solid #30435e;border-radius:12px;padding:14px;color:white;font-size:16px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #37d6a022}.search{border:0;border-radius:12px;background:var(--accent);color:#062018;font-weight:800;padding:0 17px;font-size:14px;cursor:pointer}.hint{font-size:12px;color:var(--muted);margin:9px 0 0;line-height:1.5}.result{display:none;margin-top:15px;border:1px solid #28775f;background:#0b2928;border-radius:14px;padding:15px}.result.show{display:block}.result h2{font-size:19px;margin:0 0 12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{background:#102f30;border:1px solid #24504a;border-radius:10px;padding:10px}.detail small{display:block;color:#a4c9bd;font-size:11px;margin-bottom:4px}.detail strong{font-size:18px;overflow-wrap:anywhere}.copy{margin-top:12px;border:1px solid #397e6a;background:#123d35;color:#b5ffe4;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.error{color:#ffb3b3;font-size:13px;margin-top:10px;display:none}.error.show{display:block}.foot{text-align:center;color:#8192aa;font-size:11px;padding:5px 0 15px}
@media(max-width:380px){.card{padding:14px}.tab{font-size:11px}.search{padding:0 12px}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="logo">🌐</div><h1>Country Code Finder</h1><p>দেশের নাম, শর্ট কোড অথবা ফোন নম্বর দিয়ে খুঁজুন</p></header>
<section class="card">
<div class="tabs" role="tablist">
<button class="tab active" data-mode="country">দেশের নাম</button>
<button class="tab" data-mode="code">শর্ট কোড</button>
<button class="tab" data-mode="phone">ফোন নম্বর</button>
</div>
<label class="fieldlabel" id="fieldLabel" for="query">দেশের নাম লিখুন (যেমন: Bangladesh)</label>
<div class="inputrow"><input class="input" id="query" autocomplete="off" placeholder="Bangladesh / বাংলাদেশ"><button class="search" id="search">খুঁজুন</button></div>
<p class="hint" id="hint">দেশের নাম লিখে ISO 2-letter code, 3-letter code ও ফোনের ডায়ালিং কোড দেখুন।</p>
<div class="error" id="error" role="alert"></div>
<div class="result" id="result" aria-live="polite"><h2 id="countryName"></h2><div class="details">
<div class="detail"><small>Short Code (ISO-2)</small><strong id="iso2"></strong></div>
<div class="detail"><small>ISO-3</small><strong id="iso3"></strong></div>
<div class="detail"><small>Phone Dial Code</small><strong id="dial"></strong></div>
</div><button class="copy" id="copy">📋 ফলাফল কপি করুন</button></div>
</section>
<div class="foot">Country data included in this HTML · Offline search</div>
</main>
<script>
const countries=[

ras","HN","HND","+504"],["Hong Kong","HK","HKG","+852"],["Hungary","HU","HUN","+36"],["Iceland","IS","ISL","+354"],["India","IN","IND","+91"],["Indonesia","ID","IDN","+62"],["Iran","IR","IRN","+98"],["Iraq","IQ","IRQ","+964"],["Ireland","IE","IRL","+353"],["Israel","IL","ISR","+972"],["Italy","IT","ITA","+39"],["Ivory Coast","CI","CIV","+225"],["Jamaica","JM","JAM","+1"],["Japan","JP","JPN","+81"],["Jordan","JO","JOR","+962"],["Kazakhstan","KZ","KAZ","+7"],["Kenya","KE","KEN","+254"],["Kuwait","KW","KWT","+965"],["Kyrgyzstan","KG","KGZ","+996"],["Laos","LA","LAO","+856"],["Latvia","LV","LVA","+371"],["Lebanon","LB","LBN","+961"],["Lesotho","LS","LSO","+266"],["Liberia","LR","LBR","+231"],["Libya","LY","LBY","+218"],["Liechtenstein","LI","LIE","+423"],["Lithuania","LT","LTU","+370"],["Luxembourg","LU","LUX","+352"],["Macau","MO","MAC","+853"],["Madagascar","MG","MDG","+261"],["Malawi","MW","MWI","+265"],["Malaysia","MY","MYS","+60"],["Maldives","MV","MDV","+960"],["Mali","ML","MLI","+223"],["Malta","MT","MLT","+356"],["Mauritania","MR","MRT","+222"],["Mauritius","MU","MUS","+230"],["Mexico","MX","MEX","+52"],["Moldova","MD","MDA","+373"],["Monaco","MC","MCO","+377"],["Mongolia","MN","MNG","+976"],["Montenegro","ME","MNE","+382"],["Morocco","MA","MAR","+212"],["Mozambique","MZ","MOZ","+258"],["Myanmar","MM","MMR","+95"],["Namibia","NA","NAM","+264"],["Nepal","NP","NPL","+977"],["Netherlands","NL","NLD","+31"],["New Zealand","NZ","NZL","+64"],["Nicaragua","NI","NIC","+505"],["Niger","NE","NER","+227"],["Nigeria","NG","NGA","+234"],["North Korea","KP","PRK","+850"],["North Macedonia","MK","MKD","+389"],["Norway","NO","NOR","+47"],["Oman","OM","OMN","+968"],["Pakistan","PK","PAK","+92"],["Palestine","PS","PSE","+970"],["Panama","PA","PAN","+507"],["Papua New Guinea","PG","PNG","+675"],["Paraguay","PY","PRY","+595"],["Peru","PE","PER","+51"],["Philippines","PH","PHL","+63"],["Poland","PL","POL","+48"],["Portugal","PT","PRT","+351"],["Qatar","QA","QAT","+974"],["Romania","RO","ROU","+40"],["Russia","RU","RUS","+7"],["Rwanda","RW","RWA","+250"],["Saudi Arabia","SA","SAU","+966"],["Senegal","SN","SEN","+221"],["Serbia","RS","SRB","+381"],["Seychelles","SC","SYC","+248"],["Sierra Leone","SL","SLE","+232"],["Singapore","SG","SGP","+65"],["Slovakia","SK","SVK","+421"],["Slovenia","SI","SVN","+386"],["Somalia","SO","SOM","+252"],["South Africa","ZA","ZAF","+27"],["South Korea","KR","KOR","+82"],["South Sudan","SS","SSD","+211"],["Spain","ES","ESP","+34"],["Sri Lanka","LK","LKA","+94"],["Sudan","SD","SDN","+249"],["Suriname","SR","SUR","+597"],["Sweden","SE","SWE","+46"],["Switzerland","CH","CHE","+41"],["Syria","SY","SYR","+963"],["Taiwan","TW","TWN","+886"],["Tajikistan","TJ","TJK","+992"],["Tanzania","TZ","TZA","+255"],["Thailand","TH","THA","+66"],["Togo","TG","TGO","+228"],["Tunisia","TN","TUN","+216"],["Turkey","TR","TUR","+90"],["Turkmenistan","TM","TKM","+993"],["Uganda","UG","UGA","+256"],["Ukraine","UA","UKR","+380"],["United Arab Emirates","AE","ARE","+971"],["United Kingdom","GB","GBR","+44"],["United States","US","USA","+1"],["Uruguay","UY","URY","+598"],["Uzbekistan","UZ","UZB","+998"],["Venezuela","VE","VEN","+58"],["Vietnam","VN","VNM","+84"],["Yemen","YE","YEM","+967"],["Zambia","ZM","ZMB","+260"],["Zimbabwe","ZW","ZWE","+263"],
["দক্ষিণ সুদান","SS","SSD","+211"],["বাংলাদেশ","BD","BGD","+880"],["ভারত","IN","IND","+91"],["পাকিস্তান","PK","PAK","+92"],["নেপাল","NP","NPL","+977"],["ভুটান","BT","BTN","+975"],["শ্রীলঙ্কা","LK","LKA","+94"],["মালদ্বীপ","MV","MDV","+960"],["সুদান","SD","SDN","+249"],["ক্যামেরুন","CM","CMR","+237"],["গিনি","GN","GIN","+224"],["আইভরি কোস্ট","CI","CIV","+225"],["ঘানা","GH","GHA","+233"],["নাইজেরিয়া","NG","NGA","+234"],["মিশর","EG","EGY","+20"],["সৌদি আরব","SA","SAU","+966"],["সংযুক্ত আরব আমিরাত","AE","ARE","+971"],["যুক্তরাষ্ট্র","US","USA","+1"],["যুক্তরাজ্য","GB","GBR","+44"],["চীন","CN","CHN","+86"],["জাপান","JP","JPN","+81"],["মালয়েশিয়া","MY","MYS","+60"],["ইন্দোনেশিয়া","ID","IDN","+62"],["তুরস্ক","TR","TUR","+90"],["ফ্রান্স","FR","FRA","+33"],["জার্মানি","DE","DEU","+49"],["রাশিয়া","RU","RUS","+7"]
];
let mode="country";
const $=id=>document.getElementById(id), input=$("query");
const labels={country:["দেশের নাম লিখুন (যেমন: Bangladesh)","Bangladesh / বাংলাদেশ","দেশের নাম লিখে ISO 2-letter code, 3-letter code ও ফোনের ডায়ালিং কোড দেখুন।"],code:["শর্ট কোড লিখুন (যেমন: BD, BGD বা +880)","BD / BGD / +880","ISO-2, ISO-3 অথবা ফোনের ডায়ালিং কোড লিখুন।"],phone:["ফোন নম্বর লিখুন (যেমন: +8801712345678)","+8801712345678","দেশের ডায়ালিং কোডসহ নম্বর লিখুন। নম্বরের শুরুতে + না থাকলেও চেষ্টা করতে পারেন।"]};
function normalize(s){return s.trim().toLocaleLowerCase().replace(/[\s\-()]/g,"")}
function search(){
 const q=input.value.trim();$("error").classList.remove("show");$("result").classList.remove("show");
 if(!q){error("অনুগ্রহ করে তথ্য লিখুন।");return}
 let found=[];
 if(mode==="country"){
  const n=normalize(q);
  found=countries.filter(c=>normalize(c[0])===n);
  if(!found.length) found=countries.filter(c=>normalize(c[0]).includes(n));
 }else if(mode==="code"){
  const n=normalize(q).replace(/^\+/,"");
  found=countries.filter(c=>c[1].toLowerCase()===n||c[2].toLowerCase()===n||c[3].replace("+","")===n);
 }else{
  const digits=q.replace(/\D/g,"");
  if(!digits){error("সঠিক ফোন নম্বর লিখুন।");return}
  const sorted=[...new Set(countries)].sort((a,b)=>b[3].length-a[3].length);
  found=sorted.filter(c=>digits.startsWith(c[3].replace("+","")));
 }
 if(!found.length){error("কোনো মিল পাওয়া যায়নি। বানান বা কোডটি পরীক্ষা করুন।");return}
 const c=found[0];$("countryName").textContent=c[0];$("iso2").textContent=c[1];$("iso3").textContent=c[2];$("dial").textContent=c[3];$("result").classList.add("show");
}
function error(s){$("error").textContent=s;$("error").classList.add("show")}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));$("fieldLabel").textContent=labels[mode][0];input.placeholder=labels[mode][1];$("hint").textContent=labels[mode][2];$("result").classList.remove("show");$("error").classList.remove("show");input.value=""}));
$("search").addEventListener("click",search);input.addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("copy").addEventListener("click",async()=>{const s=`${$("countryName").textContent}\nISO-2: ${$("iso2").textContent}\nISO-3: ${$("iso3").textContent}\nDial Code: ${$("dial").textContent}`;try{await navigator.clipboard.writeText(s);$("copy").textContent="✓ কপি হয়েছে"}catch(e){error("কপি করা যায়নি। ফলাফলটি হাতে কপি করুন।")}});
</script>
</body>
</html>
